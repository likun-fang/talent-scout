companies: []   # filled by startups/industry channel
open_source_anchors:
  - {url: "https://github.com/XPolicyLab/XPolicyLab", selection_reason: "Model-specific upstream paper and code discovery; separate adapters from original research."}
  - {url: "https://github.com/huggingface/lerobot", selection_reason: "Inspect relevant policy modules and model releases, not all contributions."}
  - {url: "https://github.com/openvla/openvla", selection_reason: "Original VLA implementation; verify individual geography."}
  - {url: "https://github.com/real-stanford/diffusion_policy", selection_reason: "Original policy code; older work needs separate qualifying recent evidence."}
  - {url: "https://github.com/leggedrobotics/rsl_rl", selection_reason: "Auxiliary learned robot-policy source; no automatic VLA or VLM label."}
  - {url: "https://github.com/google-deepmind/mujoco_playground", selection_reason: "Auxiliary robot-policy and evaluation source; verify individual contributions."}
# Flat keywords remain available to existing channel workflows. Directions above define relevance and query groups.
keywords: [robot learning, embodied, manipulation, humanoid, legged locomotion, sim-to-real, vision-language-action, vision language action, VLA, vision-language model, vision language model, VLM, embodied multimodal reasoning, vision-language robot planning, embodied question answering, open-vocabulary robot perception, robot world model, world-action model, WAM, action-conditioned video robot, learned dynamics robot planning, dexterous, imitation learning, reinforcement learning robot, robot policy, robot policies, robotic policy, robotic policies, visuomotor policy, visuomotor policies, diffusion policy, diffusion policies, generalist robot policy, generalist robot policies, robot action generation, flow matching for robot control, flow-based robot policy, flow-based robot policies]
keyword_rules: ""
prizes_filter: engineering

