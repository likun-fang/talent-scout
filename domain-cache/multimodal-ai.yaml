prizes_filter: computing
historical_snapshot: {}
# Field-specific rules the scripts hold in code today, written down so the next field changes a pack, not a script.
quirks:
  title_words: []
  institution_patterns:
    - {pattern: "NAVER|DeepMind|Google|Facebook|Sony|Bosch|Mistral|Aleph Alpha|Microsoft|NVIDIA|Hugging Face", kind: company, reason: "employer names the role rules read as companies (scripts/current_affiliation.py COMPANY_NAMES)"}
    - {pattern: "Meta|FAIR|Apple|Amazon", kind: not-by-name, reason: "too short or too common to decide alone; a company suffix or the provider type decides (references/40-entity-resolution.md)"}
  evidence_venues:
    - {name: "CVPR, ICCV and ECCV paper awards", evidence: paper_award, reason: "tc.computer.org TCPAMI award lists (venues.conferences award_page_pattern)"}
    - {name: "NeurIPS competition track", evidence: competition_result, reason: "multimodal entries and challenge winners (competitions)"}
