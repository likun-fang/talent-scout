domain: "multimodal AI (vision-language models, multimodal foundation models, multimodal generation and understanding)"
slug: multimodal-ai
derived_on: "2026-10-14"
window: {from: "2023-10-14", to: "2026-10-14"}   # OpenAlex counts below use this window
sources_used:
  - "openalex-topics (searches: multimodal, vision-language, image generation, text-to-image diffusion, video understanding, image captioning; stage1/topic-search.txt)"
  - openalex-group-by (venues, institutions, authors for T11714+T10775, any author in EU27+UK+CH+NO; second institution list restricted to DE|CH)
  - openalex-institutions (country and type of each listed institution; MCML and Tübingen AI Center carry no country_code, set to DE)
  - erc-panels, euroscivoc
  - gepris (fachkolleg aggregation for vision-language, vision language model, multimodal learning, multimodal large language model, text-to-image, visual question answering, image captioning, diffusion model image, cross-modal; stage1/gepris-fachkolleg.txt)
  - snsf grants.csv (MainDiscipline of keyword-matching grants decided 2022+)
  - github (topic search vision-language-model, multimodal, multimodal-large-language-models, text-to-image, vlm; org locations; stage1/github-*.txt)
  - web-search (tc.computer.org TCPAMI award lists for CVPR/ICCV/ECCV; NeurIPS 2025 competitions; challenge winners)
  - "dropped topic hits: language/discourse, emotion recognition, biometrics, surgery, terahertz, fluorescence microscopy and other non-ML meanings of 'multimodal' / 'image generation'"
region_core: "DE+CH"
region_extended: "EU27+UK+CH+NO"
facets_file: assets/facets/multimodal-ai.json  # relative to SKILL_ROOT
scope: {core: [], conditional: [], excluded: []}  # not derived in this run
directions: []
discovery_seeds: []
collection_requirements: []
openalex_topics:
  - {id: T11714, name: Multimodal Machine Learning Applications, fit: core, selection_reason: "first hit for every phrase tried (multimodal, vision-language, image generation, video understanding, image captioning)"}
  - {id: T10775, name: Generative Adversarial Networks and Image Synthesis, fit: adjacent, selection_reason: "only hit for 'text-to-image diffusion'; carries the generation side (latent diffusion) but also unconditional GANs and medical image synthesis, so downstream use needs a title keyword filter (text, language, caption, prompt, multimodal, vision-language)"}
topic_discovery_queries: []  # the topic searches are listed in sources_used
venues:
  conferences:
    - {name: CVPR, openalex_source_id: S4210176548, award_page_pattern: "https://tc.computer.org/tcpami/awards/cvpr-paper-awards/ (all years); cvpr.thecvf.com/Conferences/<year>/News/Awards"}
    - {name: ICCV, openalex_source_id: S4363607764, award_page_pattern: "https://tc.computer.org/tcpami/awards/iccv-paper-awards/ (Marr Prize + honorable mentions)"}
    - {name: ECCV, openalex_source_id: null, award_page_pattern: "https://tc.computer.org/tcpami/awards/eccv-paper-awards/; eccv<year>.ecva.net", selection_reason: "published inside Lecture Notes in Computer Science (S106296714, 1544 works), which OpenAlex does not split by conference"}
    - {name: NeurIPS, openalex_source_id: S4363606243, award_page_pattern: "blog.neurips.cc/<year>/ announcing-the-neurips-<year>-best-paper-awards; datasets & benchmarks track included"}
    - {name: ICLR, openalex_source_id: null, award_page_pattern: "blog.iclr.cc/<year>/ outstanding paper awards", selection_reason: "OpenReview-hosted, absent from the OpenAlex venue facet; the field's main ML venue"}
    - {name: ICML, openalex_source_id: null, award_page_pattern: "icml.cc/virtual/<year>/awards_detail", selection_reason: "PMLR-hosted, absent from the facet"}
    - {name: ACL, openalex_source_id: S4363608652, award_page_pattern: "<year>.aclweb.org/program/best_papers/"}
    - {name: EMNLP, openalex_source_id: S4363608991, award_page_pattern: "<year>.emnlp.org/program/best_papers/"}
    - {name: ACM Multimedia, openalex_source_id: S4363608757, award_page_pattern: "acmmm<year>.org awards"}
    - {name: AAAI, openalex_source_id: S4210191458, award_page_pattern: "aaai.org/conference/aaai/aaai-<yy>/awards"}
  journals:
    - {name: IEEE TPAMI, openalex_source_id: S199944782}
    - {name: IJCV, openalex_source_id: S25538012}
    - {name: IEEE Transactions on Multimedia, openalex_source_id: S137030581}
  dropped: "LNCS/CCIS/LNNS series, IEEE Access, Applied Sciences, Expert Systems with Applications, Neurocomputing, Pattern Recognition, Information Fusion (no award pages); ICASSP and ISBI (audio/medical side); WACV, CVPRW, ICCVW (workshop awards only through the main venue lists)"
panels_to_sweep:
  - {panel: PE6, reason: "computer vision, ML and NLP all sit here"}
  - {panel: SH4, reason: "language and cognition; catches vision-language projects led from linguistics or cognitive science, keyword filter decides"}
  - {panel: PE7, reason: "signal and image processing; audio-visual work"}
euroscivoc_paths:
  - "/natural sciences/computer and information sciences/artificial intelligence/computer vision"
  - "/natural sciences/computer and information sciences/artificial intelligence/machine learning"
  - "/natural sciences/computer and information sciences/artificial intelligence/natural language processing"
register_subject_filters:
  dfg_review_boards: ["4.43", "4.41"]
  dfg_note: "4.43 (computer science) leads every specific keyword (vision-language 56/122, multimodal learning 230/920, MLLM 29/62); 4.41 (systems engineering) carries robotics VLA. Bare 'multimodal' returns 20315 projects across all boards (multimodal imaging, linguistics, psychology), so it is never used without a board filter. 1.14/1.22/2.22/2.23 hits are linguistics, psychology and medicine."
  snsf_main_disciplines: ["Information Technology", "Multi-disciplinary MINT", "MINT + LS"]
  snsf_note: "of keyword-matching grants decided 2022+, 26 are Information Technology; psychology, neurology, ethnology and linguistics hits are other meanings of 'multimodal'"
competitions:
  - {name: "Perception Test Challenge (ECCV 2024, ICCV 2025 workshop)", results_url_pattern: "ptchallenge-workshop.github.io; challenge report on arXiv", roster_source: repo, fit: core, selection_reason: "multimodal video QA and grounding, run by Google DeepMind London; report names winning teams and affiliations"}
  - {name: "NeurIPS competition track, multimodal entries (DCVLR 2025, MMU-RAG 2025, later years)", results_url_pattern: "neurips.cc/virtual/<year>/competition/...", roster_source: team_site, fit: core, selection_reason: "listed under 'Generative AI, LLMs and Reasoning' in the NeurIPS 2025 competitions announcement"}
  - {name: "EPIC-KITCHENS challenges (CVPR workshop)", results_url_pattern: "epic-kitchens.github.io/<year>; annual technical report", roster_source: tdp, fit: adjacent, selection_reason: "egocentric video-language tasks; Bristol-run, report lists winners with affiliations"}
  - {name: "Ego4D / Ego-Exo4D challenges (CVPR/ECCV workshops)", results_url_pattern: "ego4d-data.org/workshops/<venue><yy>", roster_source: repo, fit: adjacent, selection_reason: "video-language queries, NLQ and captioning tracks"}
  - {name: "NTIRE / AIM challenges, text-to-image and generation quality tracks only", results_url_pattern: "cvlai.net/ntire/<year>; challenge report on arXiv", roster_source: tdp, fit: adjacent, selection_reason: "organised from Würzburg (core region); reports list every team with members and affiliations"}
  - {name: "ImageCLEF multimodal tasks (MultimodalReasoning, medical caption / VQA)", results_url_pattern: "ceur-ws.org overview paper per year", roster_source: tdp, fit: adjacent, selection_reason: "European evaluation campaign (CLEF); overview papers list participating teams"}
  - {name: "MediaEval multimodal tasks", results_url_pattern: "multimediaeval.github.io/editions/<year>", roster_source: tdp, fit: adjacent, selection_reason: "European multimedia benchmark; working-notes papers carry authors"}
  - {name: "SemEval multimodal tasks", results_url_pattern: "semeval.github.io/SemEval<year>/tasks", roster_source: tdp, fit: adjacent, selection_reason: "multimodal meme / image-text tasks; system papers carry authors"}
