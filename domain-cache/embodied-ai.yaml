domain: "embodied AI: VLA, robot VLM, robot policy, world / world-action models"
slug: embodied-ai
derived_on: "2026-10-15"  # preset revision, not a fresh institutional census
window: {from: null, to: null}  # materialize from RUN_DIR/run.meta.json; default is the last 36 months
sources_used: [domain-cache-2026-10-08, official-project-pages, robodojo, xpolicylab]
region_core: "DE+CH+FR+ES+NL+BE"  # defaults only; explicit run scope takes precedence
region_extended: "EU27+UK+CH+NO"
facets_file: assets/facets/embodied-ai.json  # relative to SKILL_ROOT; copied by the stage-1 agent
scope:
  core:
    - Visual and language conditioning connected to robot action generation (VLA).
    - Vision-language methods for robot perception, grounded reasoning or planning (robot VLM).
    - Learned policies mapping observations/state and optional tasks to robot actions or action sequences.
    - World / world-action models used for robot interaction prediction, planning or control.
  conditional:
    - Manipulation, navigation, locomotion, RL and imitation learning require a concrete contribution to a core direction.
    - Foundation-model applications need a documented technical contribution; distinguish application from model development.
    - Benchmark, dataset and infrastructure work needs a direct connection to a core direction and attributable contributions.
  excluded:
    - Hardware or conventional control without a learned-policy or other core-direction contribution.
    - Text-only alignment, generic vision-language benchmarks or video generation without embodied relevance.
    - Generic repository maintenance, company membership or competition participation as sole proof of core expertise.

# Agent-readable discovery plan, not a Python scheduler. Refresh and expand these starting points each run.
directions:
  - id: vla
    queries: [vision-language-action, vision language action robot, VLA robot, generalist robot policy language]
    inclusion: Visual and language inputs condition executable robot actions; inspect the original method and contribution.
    exclusion: Language-conditioned control alone does not establish a visual input or a VLA contribution.
    seed_ids: [smolvla, openvla, xpolicylab]
  - id: vlm
    queries: [vision-language model robotics, embodied multimodal reasoning, vision-language robot planning, embodied question answering, open-vocabulary robot perception]
    inclusion: Visual-language grounding, reasoning, perception or planning in an embodied setting, with an attributable method or system contribution.
    exclusion: Calling an existing VLM does not establish VLM model authorship; generic VQA is not enough.
    seed_ids: [openeqa, nimbro-foundation-models]
  - id: robot-policy
    queries: [robot policy, visuomotor policy, diffusion policy, generalist robot policy, flow matching robot control, imitation learning robot, reinforcement learning robot]
    inclusion: A learned observation/state-to-action mapping for a robot, in simulation or on hardware.
    exclusion: Bare policy, RL or flow matching outside robot action generation is insufficient.
    seed_ids: [diffusion-policy, lerobot, xpolicylab]
  - id: wam
    queries: [robot world model, world-action model, action-conditioned video robot, learned dynamics robot planning, predictive world model manipulation]
    inclusion: Learned interaction or dynamics prediction connected to robot actions, planning or control; distinguish world models from joint world-action models.
    exclusion: Generic video prediction or generation alone is insufficient.
    seed_ids: [aha-wam, robodojo, xpolicylab]

discovery_seeds:
  - id: robodojo
    url: https://robodojo-benchmark.com/leaderboard
    selection_reason: Manipulation-policy evaluation entries lead to concrete models; capability scores describe tested models, not people.
    follow_up: Follow each relevant entry to its original paper/code; a leaderboard is not a complete VLM or European-talent census.
  - id: xpolicylab
    url: https://github.com/XPolicyLab/XPolicyLab
    selection_reason: Per-policy READMEs link original papers and code across VLA, learned policies and world-action models.
    follow_up: Separate original model authors from adapter contributors; integrated policies are not necessarily ranked entries.
  - id: smolvla
    url: https://huggingface.co/blog/smolvla
    selection_reason: Original model release links its report, named contributors and implementation.
    follow_up: Resolve report authors and specific contributions; unknown individual geography requires follow-up, not company-HQ inference.
  - id: openvla
    url: https://openvla.github.io/
    selection_reason: Original VLA project with author, paper and implementation links.
    follow_up: Verify each person's regional eligibility; a global seed does not promise European authors.
  - id: openeqa
    url: https://open-eqa.github.io/
    selection_reason: Embodied question-answering methods and evaluation provide a VLM discovery route independent of action-policy leaderboards.
    follow_up: Trace original authors and relevant subsequent work; distinguish embodied perception/reasoning from action-policy development.
  - id: nimbro-foundation-models
    url: https://arxiv.org/abs/2412.14989
    selection_reason: Named robot-system authors and perception/planning methods provide a European team discovery lead.
    follow_up: Read methods and contribution evidence before tagging individuals; do not assign every team member every method.
  - id: diffusion-policy
    url: https://diffusion-policy.cs.columbia.edu/
    selection_reason: Original visuomotor action-diffusion work and code provide a policy-method anchor.
    follow_up: The original March 2023 paper can be outside the run window; find qualifying recent work without redating the original achievement.
  - id: aha-wam
    url: https://github.com/XPolicyLab/XPolicyLab/blob/main/policy/AHA_WAM/README.md
    selection_reason: Adapter README links the original world-action-model paper and implementation.
    follow_up: Follow upstream sources to authors; adapter maintainers are separate contribution leads.
  - id: lerobot
    url: https://github.com/huggingface/lerobot
    selection_reason: Policy implementations and model releases provide attributable project/module contributions.
    follow_up: Inspect the relevant model/module and dated contributions; repository-wide top contributors are not automatically VLA authors.

collection_requirements:
  - Use all four directions in the channel briefs; source choice and query variants must cover each, not just the broad word robot.
  - Keep global model seeds for discovery; enforce run geography on people, not repository owners, paper venues or corporate headquarters.
  - Track unknown regional affiliations separately from confirmed out-of-region people; follow original authorship and public institutional/personal pages before closing the lead.
  - For relevant grants and projects, follow the PI to the project and group pages, then current members and related in-window outputs using the existing hop rules.
  - Capture explicit grant acknowledgements when available; a PI's coauthored paper alone does not establish project funding or team membership.
  - Preserve team, project and coauthor links separately; do not admit every member of a broadly relevant lab without domain evidence.
  - Preserve original dates and role headings; an undated membership is background unless it qualifies under the existing final-pass roster rule.
  - Preserve verbatim method-bearing topics/snippets with source URLs; read method sections when titles or repository names are insufficient. Do not insert guessed labels into evidence.
  - Reuse shared pages and cache across channels; per-channel budgets and existing optional-snowball limits still apply.
  - Report per-direction queries, inspected seeds, resolved people, geographic unknowns and unprocessed leads in channel coverage. Budget exhaustion is a documented gap, not proof of full coverage.
  - Zero matches require a search record; neither reading a model page nor emitting only its PI closes an unfinished author/member follow-up.

openalex_topics:
  - {id: T10462, name: Reinforcement Learning in Robotics, fit: adjacent, selection_reason: Broad discovery proxy; inspect robot-action contribution and refresh topic fit.}
  - {id: T10653, name: Robot Manipulation and Learning, fit: adjacent, selection_reason: Broad discovery proxy; not a complete VLA or VLM source.}
  - {id: T10879, name: Robotic Locomotion and Control, fit: adjacent, selection_reason: Retain learned-policy leads; conventional control is not automatically core.}
topic_discovery_queries: [vision language robotics, vision language action, robot world models, robot learning]
